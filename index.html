<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>S124 Filament Management</title>

  <script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;

      font-family: Arial, Helvetica, sans-serif;

      background: #f4f7fb;
      color: #1f2937;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      color: #004681;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      color: #667085;
      font-size: 15px;
    }

    .card {
      margin-bottom: 16px;
      padding: 18px;

      border: 1px solid #dbe3ec;
      border-radius: 20px;

      background: white;

      box-shadow:
        0 10px 28px
        rgba(31, 41, 55, 0.08);
    }

    .hidden {
      display: none !important;
    }

    label {
      display: block;
      margin-bottom: 7px;

      font-size: 14px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;

      margin-bottom: 16px;
      padding: 13px;

      border: 1px solid #d0d5dd;
      border-radius: 10px;

      font-size: 16px;
    }

    input:focus,
    select:focus {
      outline: 2px solid #84caff;
      border-color: #1570ef;
    }

    button {
      width: 100%;
      padding: 14px;

      border: 0;
      border-radius: 12px;

      background: #005bac;
      color: white;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      touch-action: manipulation;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    button:active {
      transform: scale(0.98);
    }

    .secondary {
      background: #475467;
    }

    .cancel {
      margin-top: 10px;

      background: transparent;
      color: #667085;

      border: 1px solid #d0d5dd;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .action-button {
      min-height: 105px;
      font-size: 18px;
    }

    .action-button span {
      display: block;
      margin-bottom: 8px;
      font-size: 30px;
    }

    .barcode-entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin: 12px 0;
    }

    .barcode-entry input {
      min-width: 0;
      margin: 0;
    }

    .barcode-entry button {
      width: auto;
      white-space: nowrap;
    }

    .session-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      margin-bottom: 14px;
    }

    .session-title {
      font-size: 22px;
      font-weight: 800;
    }

    .session-operator {
      margin-top: 4px;
      color: #667085;
      font-size: 13px;
    }

    .sync-lights {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .sync-light {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #98a2b3;
      box-shadow: 0 0 0 3px #f2f4f7;
    }

    .sync-light.syncing {
      background: #f79009;
      animation: sync-pulse 1.2s ease-in-out infinite;
    }

    .sync-light.ready {
      background: #12b76a;
    }

    .sync-light.warning {
      background: #f04438;
    }

    @keyframes sync-pulse {
      50% {
        opacity: 0.45;
      }
    }

    .count-badge {
      flex: 0 0 auto;

      padding: 8px 12px;

      border-radius: 999px;

      background: #eaf2fb;
      color: #005bac;

      font-size: 14px;
      font-weight: 800;
    }

    .camera-wrap {
      position: relative;

      width: 100%;
      overflow: hidden;

      border-radius: 16px;

      background: #111827;
    }

    video {
      display: block;

      width: 100%;
      height: 300px;

      object-fit: cover;

      background: #111827;
    }

    .scan-guide {
      position: absolute;

      top: 50%;
      left: 50%;

      width: 88%;
      height: 100px;

      transform: translate(-50%, -50%);

      border: 3px solid rgba(255, 255, 255, 0.95);
      border-radius: 12px;

      pointer-events: none;

      box-shadow:
        0 0 0 9999px
        rgba(0, 0, 0, 0.15);
    }

    .scan-line {
      position: absolute;

      top: 50%;
      left: 8%;

      width: 84%;
      height: 2px;

      transform: translateY(-50%);

      background: #ef4444;

      pointer-events: none;
    }

    .status {
      margin-top: 10px;

      color: #667085;
      font-size: 13px;

      text-align: center;
    }

    .torch-button {
      margin-top: 10px;
    }

    .last-scan {
      display: none;

      margin-top: 12px;
      padding: 12px;

      border-radius: 12px;

      background: #ecfdf3;
      color: #027a48;

      font-size: 14px;
      font-weight: 700;

      text-align: center;
    }

    .last-scan.show {
      display: block;
    }

    .session-list {
      margin-top: 18px;
    }

    .empty {
      padding: 24px 10px;

      color: #98a2b3;

      text-align: center;
    }

    .item {
      display: grid;

      grid-template-columns: minmax(0, 1fr) auto;

      gap: 12px;

      padding: 14px 0;

      border-bottom: 1px solid #eaecf0;
    }

    .item:last-child {
      border-bottom: 0;
    }

    .item-name {
      font-size: 16px;
      font-weight: 800;
    }

    .item-details {
      margin-top: 4px;

      color: #667085;
      font-size: 13px;
    }

    .item-barcode {
      margin-top: 5px;

      color: #98a2b3;
      font-size: 11px;
    }

    .unknown {
      color: #b42318;
    }

    .colour-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .colour-swatch {
      width: 20px;
      height: 20px;

      flex: 0 0 20px;

      border: 1px solid #cfd6df;
      border-radius: 50%;

      box-shadow:
        inset 0 0 0 1px
        rgba(255, 255, 255, 0.25);
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity button {
      width: 40px;
      height: 40px;

      padding: 0;

      border-radius: 50%;

      font-size: 22px;
      line-height: 1;

      user-select: none;
      -webkit-user-select: none;
    }

    .quantity-value {
      min-width: 28px;

      font-size: 18px;
      font-weight: 800;

      text-align: center;
    }

    .finish {
      margin-top: 18px;
    }

    .message {
      display: none;

      margin-bottom: 16px;
      padding: 13px;

      border-radius: 12px;

      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    .message.error {
      border: 1px solid #fda29b;

      background: #fef3f2;
      color: #b42318;
    }

    .message.success {
      border: 1px solid #6ce9a6;

      background: #ecfdf3;
      color: #027a48;
    }

    .message.info {
      border: 1px solid #84caff;

      background: #eff8ff;
      color: #175cd3;
    }

    .success-screen {
      text-align: center;
    }

    .success-icon {
      margin-bottom: 12px;
      font-size: 55px;
    }

    .success-screen h2 {
      margin: 0 0 8px;
    }

    .success-details {
      margin-bottom: 20px;

      color: #667085;

      line-height: 1.6;
    }

    .manual-button {
      margin-top: 10px;
      background: #7f56d9;
    }

    .step-label {
      margin: 14px 0 8px;
      color: #475467;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 8px;
    }

    .choice {
      background: white;
      color: #344054;
      border: 1px solid #d0d5dd;
    }

    .choice.active {
      background: #eff8ff;
      color: #004681;
      border-color: #005bac;
    }

    .choice-with-swatch {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      text-align: left;
    }

    .choice-swatch {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      border: 1px solid #cfd6df;
      border-radius: 50%;
      box-shadow:
        inset 0 0 0 1px
        rgba(255, 255, 255, 0.25);
    }

    .register-summary {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: #f8fafc;
      color: #475467;
      font-size: 13px;
    }

    .two-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

  </style>
</head>


<body>

  <main class="app">

    <header class="header">

      <h1>
        S124 Filament Management
      </h1>

      <p>
        Filament inventory scanner
      </p>

    </header>


    <div
      id="globalMessage"
      class="message"
    ></div>


    <!-- LOGIN -->

    <section
      id="loginScreen"
      class="card"
    >

      <label for="operatorName">
        Name
      </label>

      <input
        id="operatorName"
        type="text"
        autocomplete="name"
        placeholder="Enter your name"
      >


      <label for="operatorPin">
        PIN
      </label>

      <input
        id="operatorPin"
        type="password"
        inputmode="numeric"
        placeholder="Enter PIN"
      >


      <button
        id="continueButton"
        type="button"
      >
        Continue
      </button>

    </section>


    <!-- ACTION -->

    <section
      id="actionScreen"
      class="card hidden"
    >

      <div class="session-header">

        <div>

          <div class="session-title">
            Select Action
          </div>

          <div
            id="loggedInName"
            class="session-operator"
          ></div>

        </div>

        <div class="sync-lights" role="status" aria-live="polite">
          <span
            id="barcodeMapLight"
            class="sync-light"
            aria-label="Barcode map waiting"
          ></span>
          <span
            id="catalogueLight"
            class="sync-light"
            aria-label="Catalogue waiting"
          ></span>
        </div>

      </div>


      <div class="action-grid">

        <button
          id="scanInButton"
          class="action-button"
          type="button"
        >
          <span>📥</span>
          Scan In
        </button>


        <button
          id="scanOutButton"
          class="action-button secondary"
          type="button"
        >
          <span>📤</span>
          Scan Out
        </button>

      </div>


      <button
        id="manualButton"
        class="manual-button"
        type="button"
      >
        Manual Third-Party Entry
      </button>

      <button
        id="changeOperatorButton"
        class="cancel"
        type="button"
      >
        Change Operator
      </button>

    </section>


    <!-- SCANNER -->

    <section
      id="scannerScreen"
      class="card hidden"
    >

      <div class="session-header">

        <div>

          <div
            id="sessionTitle"
            class="session-title"
          >
            Scan In
          </div>

          <div
            id="sessionOperator"
            class="session-operator"
          ></div>

        </div>


        <div
          id="rollCount"
          class="count-badge"
        >
          0 rolls
        </div>

      </div>


      <div class="camera-wrap">

        <video
          id="video"
          playsinline
          muted
        ></video>

        <div class="scan-guide"></div>

        <div class="scan-line"></div>

      </div>


      <div
        id="scannerStatus"
        class="status"
      >
        Starting camera...
      </div>


      <div class="barcode-entry">
        <input
          id="barcodeInput"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          maxlength="13"
          placeholder="Enter or scan barcode"
          aria-label="Barcode"
        >
        <button
          id="barcodeInputButton"
          type="button"
        >
          Add
        </button>
      </div>


      <button
        id="torchButton"
        class="secondary torch-button"
        type="button"
        disabled
      >
        🔦 Torch Unavailable
      </button>


      <div
        id="lastScan"
        class="last-scan"
      ></div>


      <div
        id="sessionList"
        class="session-list"
      >

        <div class="empty">
          Scan your first filament roll
        </div>

      </div>


      <button
        id="finishButton"
        class="finish"
        type="button"
        disabled
      >
        Finish Session
      </button>


      <button
        id="cancelSessionButton"
        class="cancel"
        type="button"
      >
        Cancel Session
      </button>

    </section>


    <!-- REGISTER UNKNOWN BAMBU BARCODE -->

    <section
      id="registerScreen"
      class="card hidden"
    >
      <div class="session-title">
        Register Bambu Filament
      </div>

      <div
        id="registerBarcode"
        class="session-operator"
      ></div>

      <div class="step-label">Material</div>
      <div id="materialChoices" class="choice-grid"></div>

      <div class="step-label">Series</div>
      <div id="seriesChoices" class="choice-grid"></div>

      <div class="step-label">Colour</div>
      <div id="colourChoices" class="choice-grid"></div>

      <div class="step-label">Package</div>
      <div id="packageChoices" class="choice-grid"></div>

      <div
        id="registerSummary"
        class="register-summary"
      >
        Select a material.
      </div>

      <div class="two-actions">
        <button
          id="registerSaveButton"
          type="button"
          disabled
        >
          Register + Add
        </button>

        <button
          id="registerCancelButton"
          class="secondary"
          type="button"
        >
          Cancel
        </button>
      </div>
    </section>


    <!-- MANUAL THIRD-PARTY -->

    <section
      id="manualScreen"
      class="card hidden"
    >
      <div class="session-title">
        Manual Third-Party Entry
      </div>

      <div class="session-operator">
        No barcode will be added.
      </div>

      <br>

      <label for="manualBrand">Brand</label>
      <input id="manualBrand" type="text">

      <label for="manualMaterial">Material</label>
      <input id="manualMaterial" type="text" value="PLA">

      <label for="manualSeries">Series / Type</label>
      <input id="manualSeries" type="text">

      <label for="manualColour">Colour</label>
      <input id="manualColour" type="text">

      <label for="manualHex">Hex</label>
      <input id="manualHex" type="text" placeholder="#000000 or #FF0000,#0000FF">

      <label for="manualPackage">Package</label>
      <select id="manualPackage">
        <option>With Spool</option>
        <option>Refill</option>
        <option>Other</option>
      </select>

      <label for="manualQuantity">Quantity</label>
      <input id="manualQuantity" type="number" min="1" value="1">

      <label for="manualAction">Action</label>
      <select id="manualAction">
        <option value="IN">Scan In</option>
        <option value="OUT">Scan Out</option>
      </select>

      <button
        id="manualSaveButton"
        type="button"
      >
        Save Manual Entry
      </button>

      <button
        id="manualCancelButton"
        class="cancel"
        type="button"
      >
        Cancel
      </button>
    </section>


    <!-- SUCCESS -->

    <section
      id="successScreen"
      class="card success-screen hidden"
    >

      <div class="success-icon">
        ✓
      </div>

      <h2>
        Session Complete
      </h2>

      <div
        id="successDetails"
        class="success-details"
      ></div>

      <button
        id="newSessionButton"
        type="button"
      >
        New Session
      </button>

    </section>

  </main>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxHVBl6Qr3w2u4F8ScHDhxnSMVImeRcZoldOAJ2Txc004kEExYCoROUgk1MbUzerQL9Qw/exec";


    const SAME_BARCODE_COOLDOWN =
      2500;

    const API_REQUEST_TIMEOUT =
      30000;

    const BARCODE_CACHE_KEY =
      "s124FilamentBarcodeCacheV1";

    const BARCODE_CACHE_MAX_AGE =
      7 * 24 * 60 * 60 * 1000;

    const BARCODE_CACHE_MAX_ITEMS =
      500;


    let operatorName = "";
    let operatorPin = "";
    let operatorPinHash = "";

    let sessionAction = "";
    let sessionSubmitting = false;
    let registrationSubmitting = false;
    let manualSubmitting = false;

    let codeReader = null;
    let scannerControls = null;

    let scanning = false;

    let sessionItems = {};

    let lastBarcode = "";
    let lastBarcodeTime = 0;
    let wiredBarcodeBuffer = "";
    let wiredBarcodeTimer = null;

    let activeVideoTrack = null;
    let torchOn = false;

    let catalogueItems = [];
    let barcodeCache =
      loadBarcodeCache();
    let pendingBarcode = "";
    let registration = {
      material: "",
      series: "",
      colour: "",
      colourCode: "",
      packageType: "",
      productId: ""
    };


    const $ =
      id =>
        document.getElementById(
          id
        );


    function getColourStops(
      colourCode
    ) {
      return String(
        colourCode || ""
      )
        .split(",")
        .map(
          value =>
            value.trim()
        )
        .filter(
          value =>
            /^#[0-9A-Fa-f]{6}$/.test(
              value
            )
        );
    }


    function getColourBackground(
      colourCode
    ) {
      const colours =
        getColourStops(
          colourCode
        );

      if (
        colours.length === 0
      ) {
        return "#d0d5dd";
      }

      if (
        colours.length === 1
      ) {
        return colours[0];
      }

      return (
        "linear-gradient(90deg, " +
        colours.join(", ") +
        ")"
      );
    }


    /*
     * BUTTON EVENTS
     */

    $("continueButton")
      .addEventListener(
        "click",
        continueLogin
      );


    $("scanInButton")
      .addEventListener(
        "click",
        () =>
          startSession(
            "IN"
          )
      );


    $("scanOutButton")
      .addEventListener(
        "click",
        () =>
          startSession(
            "OUT"
          )
      );


    $("manualButton")
      .addEventListener(
        "click",
        () => showScreen("manualScreen")
      );


    $("registerSaveButton")
      .addEventListener(
        "click",
        saveRegistration
      );


    $("registerCancelButton")
      .addEventListener(
        "click",
        cancelRegistration
      );


    $("manualSaveButton")
      .addEventListener(
        "click",
        saveManualEntry
      );


    $("manualCancelButton")
      .addEventListener(
        "click",
        () => showScreen("actionScreen")
      );


    $("changeOperatorButton")
      .addEventListener(
        "click",
        logout
      );


    $("finishButton")
      .addEventListener(
        "click",
        finishSession
      );


    $("cancelSessionButton")
      .addEventListener(
        "click",
        cancelSession
      );


    $("newSessionButton")
      .addEventListener(
        "click",
        newSession
      );


    $("torchButton")
      .addEventListener(
        "click",
        toggleTorch
      );


    $("barcodeInputButton")
      .addEventListener(
        "click",
        submitBarcodeInput
      );


    $("barcodeInput")
      .addEventListener(
        "input",
        event => {
          event.target.value =
            event.target.value
              .replace(
                /\D/g,
                ""
              )
              .slice(
                0,
                13
              );
        }
      );


    $("barcodeInput")
      .addEventListener(
        "keydown",
        event => {
          if (
            event.key === "Enter"
          ) {
            event.preventDefault();
            submitBarcodeInput();
          }
        }
      );


    document.addEventListener(
      "keydown",
      handleWiredScannerKey
    );


    $("operatorPin")
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key ===
            "Enter"
          ) {

            continueLogin();

          }

        }
      );


    /*
     * LOGIN
     */

    async function continueLogin() {

      clearMessage();


      const name =
        $("operatorName")
          .value
          .trim();


      const pin =
        $("operatorPin")
          .value
          .trim();


      if (!name) {

        showMessage(
          "Enter your name.",
          "error"
        );

        return;

      }


      if (!pin) {

        showMessage(
          "Enter the filament management PIN.",
          "error"
        );

        return;

      }


      const button =
        $("continueButton");


      button.disabled =
        true;


      button.textContent =
        "Checking PIN...";


      try {

        const pinHash =
          await sha256Hex(
            pin
          );


        const result =
          await jsonpRequest(

            API_URL +
            "?action=validatePin" +
            "&pinHash=" +
            encodeURIComponent(
              pinHash
            )

          );


        if (
          !result ||
          result.success !== true
        ) {

          throw new Error(
            result?.error ||
            "Unable to validate PIN."
          );

        }


        if (
          result.valid !== true
        ) {

          $("operatorPin")
            .value =
              "";


          showMessage(
            "Incorrect PIN.",
            "error"
          );


          return;

        }


        operatorName =
          name;


        operatorPin =
          pin;


        operatorPinHash =
          pinHash;


        $("loggedInName")
          .textContent =
            operatorName;


        showScreen(
          "actionScreen"
        );


        setBarcodeMapStatus(
          "syncing"
        );

        loadBarcodeMap()
          .catch(
            error => {
              console.error(error);

              setBarcodeMapStatus(
                Object.keys(
                  barcodeCache
                ).length > 0
                  ? "saved"
                  : "unavailable"
              );
            }
          )
          .finally(
            () => {
              setCatalogueStatus(
                "syncing"
              );

              loadCatalogue()
                .then(
                  () =>
                    setCatalogueStatus(
                      "ready"
                    )
                )
                .catch(
                  error => {
                    console.error(error);

                    setCatalogueStatus(
                      "unavailable"
                    );
                  }
                );
            }
          );


      } catch (error) {

        console.error(
          error
        );


        showMessage(

          "Unable to validate PIN: " +
          String(
            error.message ||
            error
          ),

          "error"

        );


      } finally {

        button.disabled =
          false;


        button.textContent =
          "Continue";

      }

    }


    async function sha256Hex(
      value
    ) {

      const data =
        new TextEncoder()
          .encode(
            value
          );


      const digest =
        await crypto.subtle.digest(
          "SHA-256",
          data
        );


      return Array
        .from(
          new Uint8Array(
            digest
          )
        )
        .map(
          byte =>
            byte
              .toString(16)
              .padStart(
                2,
                "0"
              )
        )
        .join(
          ""
        );

    }

    /*
     * CAMERA
     */

    async function startScanner() {

      try {

        scanning =
          true;


        torchOn =
          false;


        activeVideoTrack =
          null;


        $("torchButton")
          .disabled =
            true;


        $("torchButton")
          .textContent =
            "🔦 Checking Torch...";


        $("scannerStatus")
          .textContent =
            "Starting rear camera...";


        codeReader =
          new ZXingBrowser
            .BrowserMultiFormatReader();


        scannerControls =
          await codeReader
            .decodeFromConstraints(

              {
                audio:
                  false,

                video: {

                  facingMode: {
                    ideal:
                      "environment"
                  },

                  width: {
                    ideal:
                      1920
                  },

                  height: {
                    ideal:
                      1080
                  }

                }
              },

              $("video"),

              handleScannerResult

            );


        $("scannerStatus")
          .textContent =
            "Scan filament barcodes";


        setTimeout(
          configureCamera,
          700
        );


      } catch (error) {

        console.error(
          error
        );


        scanning =
          false;


        $("scannerStatus")
          .textContent =
            "Unable to start camera";


        $("torchButton")
          .disabled =
            true;


        $("torchButton")
          .textContent =
            "🔦 Torch Unavailable";


        showMessage(

          "Camera error: " +
          String(
            error
          ),

          "error"

        );

      }

    }


    async function configureCamera() {

      try {

        const video =
          $("video");


        if (
          !video ||
          !video.srcObject
        ) {

          return;

        }


        const tracks =
          video
            .srcObject
            .getVideoTracks();


        if (
          !tracks ||
          tracks.length === 0
        ) {

          return;

        }


        const track =
          tracks[0];


        activeVideoTrack =
          track;


        const capabilities =

          typeof track.getCapabilities ===
          "function"

            ? track.getCapabilities()

            : {};


        /*
         * AUTOFOCUS
         */

        if (
          capabilities.focusMode &&
          capabilities.focusMode.includes(
            "continuous"
          )
        ) {

          try {

            await track
              .applyConstraints({

                advanced: [
                  {
                    focusMode:
                      "continuous"
                  }
                ]

              });


          } catch (error) {

            console.log(
              "Continuous autofocus unavailable:",
              error
            );

          }

        }


        /*
         * TORCH
         */

        if (
          capabilities.torch === true
        ) {

          $("torchButton")
            .disabled =
              false;


          $("torchButton")
            .textContent =
              "🔦 Torch Off";


        } else {

          $("torchButton")
            .disabled =
              true;


          $("torchButton")
            .textContent =
              "🔦 Torch Unavailable";

        }


      } catch (error) {

        console.log(
          "Camera configuration error:",
          error
        );


        $("torchButton")
          .disabled =
            true;


        $("torchButton")
          .textContent =
            "🔦 Torch Unavailable";

      }

    }


    /*
     * TORCH CONTROL
     */

    async function toggleTorch() {

      if (
        !activeVideoTrack
      ) {

        return;

      }


      try {

        const capabilities =

          typeof activeVideoTrack.getCapabilities ===
          "function"

            ? activeVideoTrack.getCapabilities()

            : {};


        if (
          capabilities.torch !== true
        ) {

          showMessage(
            "Torch is not supported on this camera.",
            "error"
          );

          return;

        }


        const nextTorchState =
          !torchOn;


        await activeVideoTrack
          .applyConstraints({

            advanced: [
              {
                torch:
                  nextTorchState
              }
            ]

          });


        torchOn =
          nextTorchState;


        $("torchButton")
          .textContent =

            torchOn

              ? "🔦 Torch On"

              : "🔦 Torch Off";


      } catch (error) {

        console.error(
          "Torch error:",
          error
        );


        torchOn =
          false;


        $("torchButton")
          .textContent =
            "🔦 Torch Off";


        showMessage(
          "Unable to control the camera torch.",
          "error"
        );

      }

    }


    /*
     * BARCODE DETECTION
     */

    function handleScannerResult(
      result
    ) {

      if (
        !result ||
        !scanning
      ) {

        return;

      }


      const barcode =
        String(
          result.getText()
        )
          .trim();


      queueBarcode(
        barcode
      );

    }


    function submitBarcodeInput() {

      const input =
        $("barcodeInput");

      const barcode =
        String(
          input.value || ""
        ).trim();


      if (
        !/^\d{13}$/.test(
          barcode
        )
      ) {

        showMessage(
          "Enter a 13-digit barcode.",
          "error"
        );

        input.focus();

        return;

      }


      clearMessage();

      input.value =
        "";

      queueBarcode(
        barcode
      );

      input.focus();

    }


    function handleWiredScannerKey(
      event
    ) {

      if (
        $("scannerScreen")
          .classList
          .contains("hidden") ||
        event.target ===
          $("barcodeInput") ||
        event.ctrlKey ||
        event.altKey ||
        event.metaKey
      ) {

        return;

      }


      if (
        /^\d$/.test(
          event.key
        )
      ) {

        event.preventDefault();

        wiredBarcodeBuffer =
          (
            wiredBarcodeBuffer +
            event.key
          ).slice(
            -13
          );

        clearTimeout(
          wiredBarcodeTimer
        );

        wiredBarcodeTimer =
          setTimeout(
            () => {
              wiredBarcodeBuffer =
                "";
            },
            500
          );

        return;

      }


      if (
        event.key === "Enter" &&
        wiredBarcodeBuffer
      ) {

        event.preventDefault();

        const barcode =
          wiredBarcodeBuffer;

        wiredBarcodeBuffer =
          "";

        clearTimeout(
          wiredBarcodeTimer
        );


        if (
          /^\d{13}$/.test(
            barcode
          )
        ) {

          queueBarcode(
            barcode
          );

        }

      }

    }


    function queueBarcode(
      barcode
    ) {

      barcode =
        String(
          barcode || ""
        ).trim();


      if (
        !/^\d{13}$/.test(
          barcode
        )
      ) {

        return;

      }


      const now =
        Date.now();


      if (
        barcode === lastBarcode &&
        now - lastBarcodeTime <
          SAME_BARCODE_COOLDOWN
      ) {

        return;

      }


      lastBarcode =
        barcode;


      lastBarcodeTime =
        now;


      processScan(
        barcode
      );

    }


    /*
     * PROCESS SCAN
     */

    async function processScan(
      barcode
    ) {

      barcode =
        String(
          barcode || ""
        ).trim();


      playBeep();


      if (
        sessionItems[
          barcode
        ]
      ) {

        sessionItems[
          barcode
        ].quantity++;


        showLastScan(

          sessionItems[
            barcode
          ].colour +

          " ×" +

          sessionItems[
            barcode
          ].quantity

        );


        renderSession();


        return;

      }


      sessionItems[
        barcode
      ] = {

        barcode:
          barcode,

        quantity:
          1,

        loading:
          true,

        found:
          false,

        brand:
          "",

        material:
          "",

        colour:
          "Looking up...",

        colourCode:
          "",

        packageType:
          "",

        weight:
          ""

      };


      renderSession();


      const cachedProduct =
        getCachedBarcodeProduct(
          barcode
        );


      if (
        cachedProduct
      ) {

        setResolvedSessionItem(
          barcode,
          cachedProduct
        );


        renderSession();


        return;

      }


      try {

        const result =
          await lookupBarcode(
            barcode
          );


        if (
          result &&
          result.success &&
          result.found &&
          result.product
        ) {

          const product =
            result.product;


          cacheBarcodeProduct(
            barcode,
            product
          );


          setResolvedSessionItem(
            barcode,
            product
          );


        } else {

          delete sessionItems[
            barcode
          ];

          await beginRegistration(
            barcode
          );

          return;

        }


      } catch (error) {

        console.error(
          error
        );


        sessionItems[
          barcode
        ].loading =
          false;


        sessionItems[
          barcode
        ].found =
          false;


        sessionItems[
          barcode
        ].colour =
          "Lookup Failed";


        showMessage(

          "Unable to look up " +
          barcode +
          ".",

          "error"

        );

      }


      renderSession();

    }


    function setResolvedSessionItem(
      barcode,
      product
    ) {

      const currentItem =
        sessionItems[
          barcode
        ];


      if (
        !currentItem
      ) {

        return;

      }


      sessionItems[
        barcode
      ] = {

        barcode:
          barcode,

        quantity:
          currentItem.quantity,

        loading:
          false,

        found:
          true,

        productId:
          product.productId ||
          "",

        brand:
          product.brand ||
          "",

        material:
          product.material ||
          "",

        series:
          product.series ||
          "",

        colour:
          product.colour ||
          "",

        colourCode:
          product.colourCode ||
          "",

        packageType:
          product.packageType ||
          "",

        weight:
          product.weight ||
          ""

      };


      showLastScan(

        (
          product.material ||
          ""
        ) +

        (
          product.series
            ? " · " + product.series
            : ""
        ) +

        " · " +

        (
          product.colour ||
          barcode
        )

      );

    }


    function loadBarcodeCache() {

      try {

        const stored =
          JSON.parse(
            localStorage.getItem(
              BARCODE_CACHE_KEY
            ) ||
            "{}"
          );


        if (
          stored &&
          typeof stored === "object" &&
          !Array.isArray(stored)
        ) {

          return stored;

        }

      } catch (error) {

        console.warn(
          "Unable to load barcode cache:",
          error
        );

      }


      return {};

    }


    function getCachedBarcodeProduct(
      barcode
    ) {

      const entry =
        barcodeCache[
          barcode
        ];


      if (
        !entry ||
        !entry.product ||
        !entry.cachedAt ||
        Date.now() - entry.cachedAt >
          BARCODE_CACHE_MAX_AGE
      ) {

        if (
          entry
        ) {

          delete barcodeCache[
            barcode
          ];


          saveBarcodeCache();

        }


        return null;

      }


      return entry.product;

    }


    function cacheBarcodeProduct(
      barcode,
      product
    ) {

      barcodeCache[
        barcode
      ] = {

        cachedAt:
          Date.now(),

        product:
          createCachedProduct(
            product
          )

      };


      const barcodes =
        Object.keys(
          barcodeCache
        );


      if (
        barcodes.length >
        BARCODE_CACHE_MAX_ITEMS
      ) {

        barcodes
          .sort(
            (first, second) =>
              barcodeCache[first].cachedAt -
              barcodeCache[second].cachedAt
          )
          .slice(
            0,
            barcodes.length -
              BARCODE_CACHE_MAX_ITEMS
          )
          .forEach(
            oldBarcode =>
              delete barcodeCache[
                oldBarcode
              ]
          );

      }


      saveBarcodeCache();

    }


    function createCachedProduct(
      product
    ) {

      return {

        productId:
          product.productId || "",

        brand:
          product.brand || "",

        material:
          product.material || "",

        series:
          product.series || "",

        colour:
          product.colour || "",

        colourCode:
          product.colourCode || "",

        packageType:
          product.packageType || "",

        weight:
          product.weight || ""

      };

    }


    function saveBarcodeCache() {

      try {

        localStorage.setItem(
          BARCODE_CACHE_KEY,
          JSON.stringify(
            barcodeCache
          )
        );

      } catch (error) {

        console.warn(
          "Unable to save barcode cache:",
          error
        );

      }

    }


    async function loadCatalogue() {
      const result =
        await jsonpRequest(
          API_URL +
          "?action=catalogue"
        );

      if (
        !result ||
        result.success !== true ||
        !Array.isArray(result.items)
      ) {
        throw new Error(
          result?.error ||
          "Unable to load catalogue."
        );
      }

      catalogueItems =
        result.items;
    }


    async function loadBarcodeMap() {

      if (
        !operatorPinHash
      ) {

        return;

      }


      const result =
        await jsonpRequest(
          API_URL +
          "?action=barcodeMap" +
          "&pinHash=" +
          encodeURIComponent(
            operatorPinHash
          )
        );


      if (
        !result ||
        result.success !== true ||
        !Array.isArray(result.items)
      ) {

        throw new Error(
          result?.error ||
          "Unable to load barcode map."
        );

      }


      const cachedAt =
        Date.now();

      const nextCache =
        {};


      result.items.forEach(
        product => {

          const barcode =
            String(
              product.barcode ||
              ""
            ).trim();


          if (
            !/^\d{13}$/.test(
              barcode
            )
          ) {

            return;

          }


          nextCache[
            barcode
          ] = {

            cachedAt:
              cachedAt,

            product:
              createCachedProduct(
                product
              )

          };

        }
      );


      barcodeCache =
        nextCache;


      saveBarcodeCache();


      setBarcodeMapStatus(
        "ready",
        Object.keys(
          nextCache
        ).length
      );

    }


    function setBarcodeMapStatus(
      state,
      itemCount
    ) {

      const element =
        $("barcodeMapLight");


      if (
        !element
      ) {

        return;

      }


      element.className =
        "sync-light " +
        (
          state === "saved"
            ? "ready"
            : state === "unavailable"
              ? "warning"
              : state
        );


      if (
        state === "ready"
      ) {

        element.setAttribute(
          "aria-label",
          "Barcode map ready, " +
          String(
            itemCount || 0
          ) +
          " barcodes"
        );

        return;

      }


      if (
        state === "saved"
      ) {

        element.setAttribute(
          "aria-label",
          "Using saved barcode map"
        );

        return;

      }


      if (
        state === "unavailable"
      ) {

        element.setAttribute(
          "aria-label",
          "Barcode map unavailable, online lookup active"
        );

        return;

      }


      element.setAttribute(
        "aria-label",
        "Syncing barcode map"
      );

    }


    function setCatalogueStatus(
      state
    ) {

      const element =
        $("catalogueLight");


      if (
        !element
      ) {

        return;

      }


      element.className =
        "sync-light " +
        (
          state === "unavailable"
            ? "warning"
            : state
        );


      element.setAttribute(
        "aria-label",
        state === "ready"
          ? "Catalogue ready"
          : state === "unavailable"
            ? "Catalogue unavailable"
            : "Syncing catalogue"
      );

    }


    async function beginRegistration(
      barcode
    ) {
      stopScanner();

      if (
        catalogueItems.length === 0
      ) {
        await loadCatalogue();
      }

      pendingBarcode =
        barcode;

      if (
        sessionItems[
          barcode
        ]
      ) {
        delete sessionItems[
          barcode
        ];
      }

      registration = {
        material: "",
        series: "",
        colour: "",
        colourCode: "",
        packageType: "",
        productId: ""
      };

      $("registerBarcode")
        .textContent =
          barcode;

      showScreen(
        "registerScreen"
      );

      renderRegistration();
    }


    function renderRegistration() {
      const materials =
        [...new Set(
          catalogueItems
            .map(item => item.material)
            .filter(Boolean)
        )].sort();

      renderChoices(
        "materialChoices",
        materials,
        registration.material,
        value => {
          registration = {
            material: value,
            series: "",
            colour: "",
            colourCode: "",
            packageType: "",
            productId: ""
          };
          renderRegistration();
        }
      );

      const materialItems =
        catalogueItems.filter(
          item =>
            item.material ===
            registration.material
        );

      const series =
        [...new Set(
          materialItems
            .map(item => item.series)
            .filter(Boolean)
        )].sort();

      renderChoices(
        "seriesChoices",
        series,
        registration.series,
        value => {
          registration.series =
            value;
          registration.colour =
            "";
          registration.colourCode =
            "";
          registration.packageType =
            "";
          registration.productId =
            "";
          renderRegistration();
        }
      );

      const seriesItems =
        materialItems.filter(
          item =>
            item.series ===
            registration.series
        );

      const colours = [];

      seriesItems.forEach(item => {
        if (
          !colours.some(
            colour =>
              colour.colour === item.colour &&
              colour.colourCode === item.colourCode
          )
        ) {
          colours.push({
            colour:
              item.colour,
            colourCode:
              item.colourCode
          });
        }
      });

      $("colourChoices")
        .innerHTML =
          colours.map(
            item => {
              const active =
                registration.colour ===
                  item.colour &&
                registration.colourCode ===
                  item.colourCode;

              return `
                <button
                  type="button"
                  class="choice choice-with-swatch ${active ? "active" : ""}"
                  data-colour="${escapeHtml(item.colour)}"
                  data-hex="${escapeHtml(item.colourCode)}"
                >
                  <span
                    class="choice-swatch"
                    style="background:${escapeHtml(
                      getColourBackground(
                        item.colourCode
                      )
                    )};"
                  ></span>
                  <span>
                    ${escapeHtml(item.colour)}
                  </span>
                </button>
              `;
            }
          ).join("");

      $("colourChoices")
        .querySelectorAll(
          ".choice"
        )
        .forEach(
          button => {
            button.addEventListener(
              "click",
              () => {
                registration.colour =
                  button.dataset.colour ||
                  "";
                registration.colourCode =
                  button.dataset.hex ||
                  "";
                registration.packageType =
                  "";
                registration.productId =
                  "";
                renderRegistration();
              }
            );
          }
        );

      const colourItems =
        seriesItems.filter(
          item =>
            item.colour ===
              registration.colour &&
            item.colourCode ===
              registration.colourCode
        );

      const packageOptions =
        ["With Spool","Refill"]
          .map(
            packageType => {
              const existing =
                colourItems.find(
                  item =>
                    item.packageType ===
                    packageType
                );

              if(existing){
                return {
                  packageType:
                    packageType,
                  productId:
                    existing.productId
                };
              }

              const source =
                colourItems[0];

              if(!source){
                return null;
              }

              const baseProductId =
                String(
                  source.productId ||
                  ""
                ).replace(
                  /-(WITH-SPOOL|REFILL|UNKNOWN)$/,
                  ""
                );

              return {
                packageType:
                  packageType,
                productId:
                  baseProductId +
                  (
                    packageType ===
                    "With Spool"
                      ? "-WITH-SPOOL"
                      : "-REFILL"
                  )
              };
            }
          )
          .filter(Boolean);

      $("packageChoices")
        .innerHTML =
          packageOptions.map(
            item => `
              <button
                type="button"
                class="choice ${
                  registration.productId === item.productId
                    ? "active"
                    : ""
                }"
                data-product-id="${escapeHtml(item.productId)}"
                data-package="${escapeHtml(item.packageType)}"
              >
                ${escapeHtml(item.packageType)}
              </button>
            `
          ).join("");

      $("packageChoices")
        .querySelectorAll(
          ".choice"
        )
        .forEach(
          button => {
            button.addEventListener(
              "click",
              () => {
                registration.productId =
                  button.dataset.productId ||
                  "";
                registration.packageType =
                  button.dataset.package ||
                  "";
                renderRegistration();
              }
            );
          }
        );

      const parts = [
        registration.material,
        registration.series,
        registration.colour,
        registration.packageType
      ].filter(Boolean);

      if (
        parts.length
      ) {
        const summaryText =
          parts.join(" · ");

        if (
          registration.colour &&
          registration.colourCode
        ) {
          $("registerSummary")
            .innerHTML = `
              <div class="colour-row">
                <span
                  class="colour-swatch"
                  style="background:${escapeHtml(
                    getColourBackground(
                      registration.colourCode
                    )
                  )};"
                ></span>
                <span>
                  ${escapeHtml(
                    summaryText
                  )}
                </span>
              </div>
            `;
        } else {
          $("registerSummary")
            .textContent =
              summaryText;
        }
      } else {
        $("registerSummary")
          .textContent =
            "Select a material.";
      }

      $("registerSaveButton")
        .disabled =
          !registration.productId;
    }


    function renderChoices(
      elementId,
      values,
      selected,
      onSelect
    ) {
      const element =
        $(elementId);

      element.innerHTML =
        values.map(
          value => `
            <button
              type="button"
              class="choice ${
                value === selected
                  ? "active"
                  : ""
              }"
              data-value="${escapeHtml(value)}"
            >
              ${escapeHtml(value)}
            </button>
          `
        ).join("");

      element
        .querySelectorAll(
          ".choice"
        )
        .forEach(
          button => {
            button.addEventListener(
              "click",
              () =>
                onSelect(
                  button.dataset.value ||
                  ""
                )
            );
          }
        );
    }


    async function saveRegistration() {
      if (
        registrationSubmitting ||
        !pendingBarcode ||
        !registration.productId
      ) {
        return;
      }

      const button =
        $("registerSaveButton");

      registrationSubmitting =
        true;

      button.disabled =
        true;

      button.textContent =
        "Registering...";

      try {
        const result =
          await jsonpRequest(
            API_URL +
            "?action=registerBarcode" +
            "&barcode=" +
            encodeURIComponent(
              pendingBarcode
            ) +
            "&productId=" +
            encodeURIComponent(
              registration.productId
            ) +
            "&pinHash=" +
            encodeURIComponent(
              operatorPinHash
            )
          );

        if (
          !result ||
          result.success !== true
        ) {
          throw new Error(
            result?.error ||
            "Unable to register barcode."
          );
        }

        const barcode =
          pendingBarcode;

        pendingBarcode =
          "";

        showScreen(
          "scannerScreen"
        );

        await startScanner();

        await processScan(
          barcode
        );

      } catch (error) {
        console.error(error);

        showMessage(
          String(
            error.message ||
            error
          ),
          "error"
        );

      } finally {
        registrationSubmitting =
          false;

        button.disabled =
          !registration.productId;

        button.textContent =
          "Register + Add";
      }
    }


    async function cancelRegistration() {
      const cancelledBarcode =
        pendingBarcode;

      pendingBarcode =
        "";

      if (
        cancelledBarcode &&
        sessionItems[
          cancelledBarcode
        ]
      ) {
        delete sessionItems[
          cancelledBarcode
        ];
      }

      lastBarcode =
        "";

      lastBarcodeTime =
        0;

      showScreen(
        "scannerScreen"
      );

      renderSession();

      await startScanner();
    }


    async function saveManualEntry() {
      if (
        manualSubmitting
      ) {

        return;

      }


      clearMessage();

      const button =
        $("manualSaveButton");

      manualSubmitting =
        true;

      button.disabled =
        true;

      button.textContent =
        "Saving...";

      const payload = {
        manual: true,
        operator:
          operatorName,
        pin:
          operatorPin,
        action:
          $("manualAction").value,
        item: {
          brand:
            $("manualBrand")
              .value
              .trim(),
          material:
            $("manualMaterial")
              .value
              .trim(),
          series:
            $("manualSeries")
              .value
              .trim(),
          colour:
            $("manualColour")
              .value
              .trim(),
          colourCode:
            $("manualHex")
              .value
              .trim(),
          packageType:
            $("manualPackage")
              .value,
          quantity:
            Number(
              $("manualQuantity")
                .value
            )
        }
      };

      try {
        const form =
          new URLSearchParams();

        form.append(
          "payload",
          JSON.stringify(
            payload
          )
        );

        const response =
          await fetch(
            API_URL,
            {
              method:
                "POST",
              body:
                form
            }
          );

        const result =
          await response.json();

        if (
          !result.success
        ) {
          throw new Error(
            result.error ||
            "Manual entry failed."
          );
        }

        $("successDetails")
          .innerHTML =
            "<strong>Manual " +
            escapeHtml(
              payload.action
            ) +
            "</strong><br>" +
            escapeHtml(
              String(
                payload.item.quantity
              )
            ) +
            " rolls<br>" +
            "Stock " +
            escapeHtml(
              String(
                result.newStock
              )
            );

        showScreen(
          "successScreen"
        );

      } catch (error) {
        console.error(error);

        showMessage(
          String(
            error.message ||
            error
          ),
          "error"
        );

      } finally {
        manualSubmitting =
          false;

        button.disabled =
          false;

        button.textContent =
          "Save Manual Entry";
      }
    }


    /*
     * BEEP
     */

    function playBeep() {

      try {

        const AudioContextClass =
          window.AudioContext ||
          window.webkitAudioContext;


        if (
          !AudioContextClass
        ) {

          return;

        }


        const audioContext =
          new AudioContextClass();


        const oscillator =
          audioContext
            .createOscillator();


        const gain =
          audioContext
            .createGain();


        oscillator.type =
          "square";


        oscillator.frequency.value =
          1200;


        gain.gain
          .setValueAtTime(
            0.18,
            audioContext.currentTime
          );


        oscillator.connect(
          gain
        );


        gain.connect(
          audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
          audioContext.currentTime +
          0.25
        );


        oscillator.onended =
          () => {

            audioContext.close();

          };


      } catch (error) {

        console.log(
          "Beep unavailable:",
          error
        );

      }

    }


    /*
     * LOOKUP
     */

    function lookupBarcode(
      barcode
    ) {

      return jsonpRequest(

        API_URL +
        "?action=lookup" +
        "&barcode=" +
        encodeURIComponent(
          barcode
        )

      );

    }


    /*
     * JSONP
     */

    function jsonpRequest(
      baseUrl
    ) {

      return new Promise(

        (
          resolve,
          reject
        ) => {

          const callbackName =

            "filamentCallback_" +

            Date.now() +

            "_" +

            Math.floor(
              Math.random() *
              100000
            );


          const script =
            document
              .createElement(
                "script"
              );


          const timeout =
            setTimeout(

              () => {

                cleanup();


                reject(
                  new Error(
                    "Request timed out."
                  )
                );

              },

              API_REQUEST_TIMEOUT

            );


          function cleanup() {

            clearTimeout(
              timeout
            );


            if (
              script.parentNode
            ) {

              script
                .parentNode
                .removeChild(
                  script
                );

            }


            try {

              delete window[
                callbackName
              ];


            } catch (error) {

              window[
                callbackName
              ] =
                undefined;

            }

          }


          window[
            callbackName
          ] =
            function(
              response
            ) {

              cleanup();


              resolve(
                response
              );

            };


          script.onerror =
            function() {

              cleanup();


              reject(
                new Error(
                  "Request failed."
                )
              );

            };


          script.src =

            baseUrl +

            "&prefix=" +

            encodeURIComponent(
              callbackName
            );


          document
            .body
            .appendChild(
              script
            );

        }

      );

    }


    /*
     * RENDER SESSION
     */

    function renderSession() {

      const list =
        $("sessionList");


      const items =
        Object.values(
          sessionItems
        );


      const total =
        items.reduce(

          (
            sum,
            item
          ) =>
            sum +
            item.quantity,

          0

        );


      $("rollCount")
        .textContent =

          total +

          (
            total === 1
              ? " roll"
              : " rolls"
          );


      if (
        items.length ===
        0
      ) {

        list.innerHTML =

          '<div class="empty">' +
          'Scan your first filament roll' +
          '</div>';


        $("finishButton")
          .disabled =
            true;


        return;

      }


      let hasProblem =
        false;


      list.innerHTML =

        items
          .map(

            item => {

              if (
                item.loading ||
                !item.found
              ) {

                hasProblem =
                  true;

              }


              const nameClass =

                item.found
                  ? "item-name"
                  : "item-name unknown";


              let details =
                "";


              if (
                item.loading
              ) {

                details =
                  "Checking catalogue...";


              } else if (
                item.found
              ) {

                details =

                  [
                    item.material,
                    item.series,
                    item.packageType,
                    item.weight
                  ]
                    .filter(
                      Boolean
                    )
                    .join(
                      " · "
                    );


              } else {

                details =
                  "Not found in Filament Catalogue";

              }


              const swatchColour =
                getColourBackground(
                  item.colourCode
                );


              const cleanBarcode =
                String(
                  item.barcode ||
                  ""
                ).trim();


              return `

                <div class="item">

                  <div>

                    <div
                      class="${nameClass} colour-row"
                    >

                      <span
                        class="colour-swatch"
                        title="${escapeHtml(
                          item.colourCode || ""
                        )}"
                        style="background:${escapeHtml(
                          swatchColour
                        )};"
                      ></span>

                      <span>
                        ${escapeHtml(
                          item.colour
                        )}
                      </span>

                    </div>


                    <div class="item-details">

                      ${escapeHtml(
                        details
                      )}

                    </div>


                    <div class="item-barcode">

                      ${escapeHtml(
                        cleanBarcode
                      )}

                    </div>

                  </div>


                  <div class="quantity">

                    <button
                      type="button"
                      class="secondary qty-minus"
                      data-barcode="${escapeHtml(
                        cleanBarcode
                      )}"
                    >
                      −
                    </button>


                    <div class="quantity-value">

                      ${item.quantity}

                    </div>


                    <button
                      type="button"
                      class="qty-plus"
                      data-barcode="${escapeHtml(
                        cleanBarcode
                      )}"
                    >
                      +
                    </button>

                  </div>

                </div>

              `;

            }

          )
          .join(
            ""
          );


      list
        .querySelectorAll(
          ".qty-minus"
        )
        .forEach(

          button => {

            button
              .addEventListener(

                "click",

                event => {

                  event.preventDefault();


                  const barcode =
                    String(
                      button
                        .dataset
                        .barcode ||
                      ""
                    ).trim();


                  changeQuantity(
                    barcode,
                    -1
                  );

                }

              );

          }

        );


      list
        .querySelectorAll(
          ".qty-plus"
        )
        .forEach(

          button => {

            button
              .addEventListener(

                "click",

                event => {

                  event.preventDefault();


                  const barcode =
                    String(
                      button
                        .dataset
                        .barcode ||
                      ""
                    ).trim();


                  changeQuantity(
                    barcode,
                    1
                  );

                }

              );

          }

        );


      $("finishButton")
        .disabled =
          hasProblem;

    }


    /*
     * QUANTITY
     */

    function changeQuantity(
      barcode,
      change
    ) {

      barcode =
        String(
          barcode || ""
        ).trim();


      const item =
        sessionItems[
          barcode
        ];


      if (
        !item
      ) {

        console.warn(
          "Quantity item not found:",
          barcode
        );


        return;

      }


      item.quantity +=
        change;


      if (
        item.quantity <=
        0
      ) {

        delete sessionItems[
          barcode
        ];

      }


      renderSession();

    }


    /*
     * FINISH SESSION
     */

    async function finishSession() {

      if (
        sessionSubmitting
      ) {

        return;

      }


      clearMessage();


      const items =
        Object.values(
          sessionItems
        );


      if (
        items.length ===
        0
      ) {

        showMessage(
          "No filament has been scanned.",
          "error"
        );


        return;

      }


      if (
        items.some(
          item =>
            !item.found ||
            item.loading
        )
      ) {

        showMessage(
          "Resolve unknown filament before finishing.",
          "error"
        );


        return;

      }


      stopScanner();


      const button =
        $("finishButton");


      sessionSubmitting =
        true;


      button.disabled =
        true;


      button.textContent =
        "Submitting...";


      const payload = {

        operator:
          operatorName,

        pin:
          operatorPin,

        action:
          sessionAction,

        items:

          items.map(

            item => ({

              barcode:
                String(
                  item.barcode ||
                  ""
                ).trim(),

              quantity:
                item.quantity

            })

          )

      };


      try {

        const form =
          new URLSearchParams();


        form.append(

          "payload",

          JSON.stringify(
            payload
          )

        );


        const response =
          await fetch(

            API_URL,

            {

              method:
                "POST",

              body:
                form

            }

          );


        const result =
          await response.json();


        if (
          !result.success
        ) {

          throw new Error(
            result.error ||
            "Session failed."
          );

        }


        $("successDetails")
          .innerHTML =

            "<strong>" +

            escapeHtml(

              sessionAction ===
                "IN"

                ? "Scan In"

                : "Scan Out"

            ) +

            "</strong><br>" +

            escapeHtml(
              String(
                result.totalRolls
              )
            ) +

            " rolls · " +

            escapeHtml(
              String(
                result.uniqueItems
              )
            ) +

            " filament types<br>" +

            "Session " +

            escapeHtml(
              result.sessionId
            );


        showScreen(
          "successScreen"
        );


      } catch (error) {

        console.error(
          error
        );


        showMessage(

          String(
            error.message ||
            error
          ),

          "error"

        );


        button.disabled =
          false;


        sessionSubmitting =
          false;


        button.textContent =
          "Finish Session";


        await startScanner();

      }

    }


    /*
     * LAST SCAN
     */

    function showLastScan(
      text
    ) {

      const element =
        $("lastScan");


      element.textContent =
        "✓ " +
        text;


      element
        .classList
        .add(
          "show"
        );


      clearTimeout(
        showLastScan.timer
      );


      showLastScan.timer =
        setTimeout(

          () => {

            element
              .classList
              .remove(
                "show"
              );

          },

          1200

        );

    }


    /*
     * STOP CAMERA
     */

    function stopScanner() {

      scanning =
        false;


      /*
       * Try switching torch off
       * before stopping the track.
       */

      if (
        activeVideoTrack &&
        torchOn
      ) {

        try {

          activeVideoTrack
            .applyConstraints({

              advanced: [
                {
                  torch:
                    false
                }
              ]

            });

        } catch (error) {

          console.log(
            "Could not disable torch:",
            error
          );

        }

      }


      torchOn =
        false;


      activeVideoTrack =
        null;


      $("torchButton")
        .disabled =
          true;


      $("torchButton")
        .textContent =
          "🔦 Torch Unavailable";


      if (
        scannerControls
      ) {

        try {

          scannerControls
            .stop();


        } catch (error) {

          console.log(
            error
          );

        }

      }


      scannerControls =
        null;


      const video =
        $("video");


      if (
        video.srcObject
      ) {

        video
          .srcObject
          .getTracks()
          .forEach(

            track =>
              track.stop()

          );


        video.srcObject =
          null;

      }

    }


    /*
     * CANCEL
     */

    function cancelSession() {

      if (
        Object.keys(
          sessionItems
        ).length >
        0
      ) {

        const confirmed =
          confirm(
            "Discard this scan session?"
          );


        if (
          !confirmed
        ) {

          return;

        }

      }


      stopScanner();


      sessionItems =
        {};


      showScreen(
        "actionScreen"
      );

    }


    /*
     * NEW SESSION
     */

    function newSession() {

      sessionItems =
        {};


      sessionAction =
        "";


      $("finishButton")
        .textContent =
          "Finish Session";


      showScreen(
        "actionScreen"
      );

    }


    /*
     * LOGOUT
     */

    function logout() {

      stopScanner();


      operatorName =
        "";


      operatorPin =
        "";


      operatorPinHash =
        "";


      $("operatorName")
        .value =
          "";


      $("operatorPin")
        .value =
          "";


      showScreen(
        "loginScreen"
      );

    }


    /*
     * SCREENS
     */

    function showScreen(
      screenId
    ) {

      [
        "loginScreen",
        "actionScreen",
        "scannerScreen",
        "registerScreen",
        "manualScreen",
        "successScreen"
      ]
        .forEach(

          id => {

            $(id)
              .classList
              .add(
                "hidden"
              );

          }

        );


      $(screenId)
        .classList
        .remove(
          "hidden"
        );

    }


    /*
     * MESSAGES
     */

    function showMessage(
      text,
      type
    ) {

      const element =
        $("globalMessage");


      element.textContent =
        text;


      element.className =
        "message show " +
        type;

    }


    function clearMessage() {

      const element =
        $("globalMessage");


      element.textContent =
        "";


      element.className =
        "message";

    }


    /*
     * HTML ESCAPE
     */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>
