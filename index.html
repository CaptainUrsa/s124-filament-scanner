<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>S124 Filament Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f7fb;
      color: #1f2937;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;

      font-size: 28px;
      color: #004681;
    }

    .header p {
      margin: 8px 0 0;

      color: #667085;
      font-size: 15px;
    }

    .card {
      background: white;

      border: 1px solid #dbe3ec;
      border-radius: 20px;

      padding: 18px;

      box-shadow:
        0 10px 28px
        rgba(31, 41, 55, 0.08);
    }

    #reader {
      width: 100%;
      overflow: hidden;

      border-radius: 16px;
    }

    .result {
      display: none;

      margin-top: 18px;
      padding: 20px;

      border: 2px solid #16a34a;
      border-radius: 16px;

      background: #ecfdf3;

      text-align: center;
    }

    .result.show {
      display: block;
    }

    .result-label {
      color: #667085;

      font-size: 12px;
      font-weight: bold;

      text-transform: uppercase;
    }

    .barcode {
      margin-top: 8px;

      font-size: 26px;
      font-weight: bold;

      color: #12314d;

      word-break: break-all;
    }

    .format {
      margin-top: 6px;

      color: #667085;
      font-size: 13px;
    }

    button {
      width: 100%;

      margin-top: 16px;
      padding: 14px;

      border: none;
      border-radius: 12px;

      background: #005bac;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    button:active {
      background: #004681;
    }

    .status {
      margin-top: 14px;

      color: #667085;
      font-size: 13px;

      text-align: center;
    }

    .manual {
      margin-top: 22px;
      padding-top: 20px;

      border-top: 1px solid #dbe3ec;
    }

    .manual label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: bold;
    }

    .manual-row {
      display: flex;
      gap: 8px;
    }

    .manual input {
      flex: 1;
      min-width: 0;

      padding: 12px;

      border: 1px solid #dbe3ec;
      border-radius: 10px;

      font-size: 17px;
    }

    .manual button {
      width: auto;

      margin: 0;
      padding-left: 18px;
      padding-right: 18px;
    }

    .error {
      display: none;

      margin-top: 15px;
      padding: 12px;

      border: 1px solid #efb4b4;
      border-radius: 12px;

      background: #fff1f1;
      color: #9b1c1c;

      font-size: 14px;
    }

    .error.show {
      display: block;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="header">

      <h1>S124 Filament Scanner</h1>

      <p>
        Scan the EAN barcode on a filament box
      </p>

    </div>


    <div class="card">

      <button
        id="startButton"
        onclick="startScanner()"
      >
        📷 Scan Barcode
      </button>


      <div id="reader"></div>


      <div
        id="status"
        class="status"
      >
        Camera not started
      </div>


      <div
        id="error"
        class="error"
      ></div>


      <div
        id="result"
        class="result"
      >

        <div class="result-label">
          Barcode Detected
        </div>

        <div
          id="barcode"
          class="barcode"
        ></div>

        <div
          id="format"
          class="format"
        >
          EAN-13
        </div>

        <button onclick="scanAgain()">
          Scan Another
        </button>

      </div>


      <div class="manual">

        <label for="manualBarcode">
          Manual barcode
        </label>

        <div class="manual-row">

          <input
            id="manualBarcode"
            type="text"
            inputmode="numeric"
            maxlength="13"
            placeholder="6975337031345"
          >

          <button onclick="manualEntry()">
            Enter
          </button>

        </div>

      </div>

    </div>

  </main>


  <script>

    let scanner = null;
    let scannerRunning = false;


    async function startScanner() {

      hideError();
      hideResult();

      document.getElementById(
        "startButton"
      ).style.display = "none";


      document.getElementById(
        "status"
      ).textContent =
        "Starting camera...";


      try {

        scanner =
          new Html5Qrcode(
            "reader",
            {
              formatsToSupport: [
                Html5QrcodeSupportedFormats.EAN_13
              ]
            }
          );


        await scanner.start(

          {
            facingMode: {
              exact: "environment"
            }
          },

          {
            fps: 12,

            qrbox: function(
              width,
              height
            ) {

              const boxWidth =
                Math.floor(
                  width * 0.9
                );

              const boxHeight =
                Math.floor(
                  boxWidth * 0.4
                );


              return {
                width: boxWidth,
                height: boxHeight
              };
            }
          },

          barcodeDetected,

          function() {
            // Ignore normal failed frames.
          }

        );


        scannerRunning = true;


        document.getElementById(
          "status"
        ).textContent =
          "Point the camera at the barcode";


      } catch (error) {

        console.error(error);


        document.getElementById(
          "startButton"
        ).style.display = "block";


        document.getElementById(
          "status"
        ).textContent =
          "Camera unavailable";


        showError(
          "Unable to open camera. " +
          String(error)
        );

      }

    }


    async function barcodeDetected(
      decodedText
    ) {

      if (!scannerRunning) {
        return;
      }


      const barcode =
        String(decodedText)
          .trim();


      if (!/^\d{13}$/.test(barcode)) {
        return;
      }


      scannerRunning = false;


      try {

        await scanner.stop();

      } catch (error) {

        console.log(error);

      }


      document.getElementById(
        "reader"
      ).innerHTML = "";


      document.getElementById(
        "status"
      ).textContent =
        "Scan complete";


      showBarcode(
        barcode,
        "EAN-13"
      );

    }


    function showBarcode(
      barcode,
      format
    ) {

      document.getElementById(
        "barcode"
      ).textContent =
        barcode;


      document.getElementById(
        "format"
      ).textContent =
        format;


      document.getElementById(
        "result"
      ).classList.add(
        "show"
      );

    }


    function scanAgain() {

      hideResult();

      document.getElementById(
        "reader"
      ).innerHTML = "";


      document.getElementById(
        "startButton"
      ).style.display = "block";


      document.getElementById(
        "status"
      ).textContent =
        "Ready to scan";

    }


    function manualEntry() {

      hideError();


      const barcode =
        document.getElementById(
          "manualBarcode"
        ).value.trim();


      if (!/^\d{13}$/.test(barcode)) {

        showError(
          "Enter a valid 13-digit EAN barcode."
        );

        return;

      }


      showBarcode(
        barcode,
        "EAN-13 (Manual)"
      );

    }


    function hideResult() {

      document.getElementById(
        "result"
      ).classList.remove(
        "show"
      );

    }


    function showError(message) {

      const error =
        document.getElementById(
          "error"
        );


      error.textContent =
        message;


      error.classList.add(
        "show"
      );

    }


    function hideError() {

      document.getElementById(
        "error"
      ).classList.remove(
        "show"
      );

    }

  </script>

</body>
</html>
