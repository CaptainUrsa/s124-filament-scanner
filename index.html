<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>S124 Filament Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f7fb;
      color: #1f2937;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      color: #004681;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      color: #667085;
      font-size: 15px;
    }

    .card {
      padding: 18px;

      border: 1px solid #dbe3ec;
      border-radius: 20px;

      background: white;

      box-shadow:
        0 10px 28px
        rgba(31, 41, 55, 0.08);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 16px;
      background: #111827;
    }

    button {
      width: 100%;

      margin-top: 14px;
      padding: 14px;

      border: 0;
      border-radius: 12px;

      background: #005bac;
      color: white;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
    }

    button:active {
      background: #004681;
    }

    .secondary {
      background: #475467;
    }

    .status {
      margin-top: 14px;

      color: #667085;
      font-size: 13px;

      text-align: center;
    }

    .camera-info {
      margin-top: 8px;

      color: #98a2b3;
      font-size: 12px;

      text-align: center;
    }

    .result {
      display: none;

      margin-top: 18px;
      padding: 20px;

      border: 2px solid #16a34a;
      border-radius: 16px;

      background: #ecfdf3;

      text-align: center;
    }

    .result.show {
      display: block;
    }

    .result-label {
      color: #667085;

      font-size: 12px;
      font-weight: 700;

      text-transform: uppercase;
    }

    .barcode {
      margin-top: 8px;

      color: #12314d;

      font-size: 26px;
      font-weight: 800;

      word-break: break-all;
    }

    .format {
      margin-top: 6px;

      color: #667085;
      font-size: 13px;
    }

    .error {
      display: none;

      margin-top: 14px;
      padding: 12px;

      border: 1px solid #efb4b4;
      border-radius: 12px;

      background: #fff1f1;
      color: #9b1c1c;

      font-size: 14px;
    }

    .error.show {
      display: block;
    }

    .manual {
      margin-top: 22px;
      padding-top: 20px;

      border-top: 1px solid #dbe3ec;
    }

    .manual label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 700;
    }

    .manual-row {
      display: flex;
      gap: 8px;
    }

    .manual input {
      flex: 1;
      min-width: 0;

      padding: 12px;

      border: 1px solid #dbe3ec;
      border-radius: 10px;

      font-size: 17px;
    }

    .manual button {
      width: auto;

      margin: 0;

      padding-left: 18px;
      padding-right: 18px;
    }
  </style>
</head>


<body>

  <main class="app">

    <header class="header">

      <h1>S124 Filament Scanner</h1>

      <p>
        Scan the EAN barcode on a filament box
      </p>

    </header>


    <section class="card">

      <button
        id="startButton"
        type="button"
        onclick="startScanner()"
      >
        📷 Scan Barcode
      </button>


      <div id="reader"></div>


      <div
        id="status"
        class="status"
      >
        Camera not started
      </div>


      <div
        id="cameraInfo"
        class="camera-info"
      ></div>


      <button
        id="zoomButton"
        class="secondary"
        type="button"
        onclick="toggleZoom()"
        style="display:none;"
      >
        Zoom
      </button>


      <div
        id="error"
        class="error"
      ></div>


      <div
        id="result"
        class="result"
      >

        <div class="result-label">
          Barcode Detected
        </div>

        <div
          id="barcode"
          class="barcode"
        ></div>

        <div
          id="format"
          class="format"
        >
          EAN-13
        </div>

        <button
          type="button"
          onclick="scanAgain()"
        >
          Scan Another
        </button>

      </div>


      <div class="manual">

        <label for="manualBarcode">
          Manual barcode
        </label>

        <div class="manual-row">

          <input
            id="manualBarcode"
            type="text"
            inputmode="numeric"
            maxlength="13"
            placeholder="6975337031345"
          >

          <button
            type="button"
            onclick="manualEntry()"
          >
            Enter
          </button>

        </div>

      </div>

    </section>

  </main>


  <script>

    let scanner = null;
    let scannerRunning = false;

    let activeTrack = null;

    let zoomSupported = false;
    let zoomMin = 1;
    let zoomMax = 1;
    let zoomCurrent = 1;


    async function startScanner() {

      hideError();
      hideResult();


      document
        .getElementById("startButton")
        .style.display =
          "none";


      document
        .getElementById("zoomButton")
        .style.display =
          "none";


      document
        .getElementById("status")
        .textContent =
          "Starting rear camera...";


      document
        .getElementById("cameraInfo")
        .textContent =
          "";


      try {

        scanner =
          new Html5Qrcode(
            "reader",
            {
              formatsToSupport: [
                Html5QrcodeSupportedFormats.EAN_13
              ],

              verbose: false
            }
          );


        /*
         * html5-qrcode requires cameraIdOrConfig
         * to contain only one camera selector.
         *
         * Resolution is handled separately below.
         */
        const cameraConfig = {

          facingMode:
            "environment"

        };


        const scanConfig = {

          fps: 15,

          qrbox: function(
            width,
            height
          ) {

            let boxWidth =
              Math.floor(
                width * 0.90
              );


            let boxHeight =
              Math.floor(
                boxWidth * 0.32
              );


            if (
              boxHeight >
              height * 0.60
            ) {

              boxHeight =
                Math.floor(
                  height * 0.60
                );

            }


            return {

              width:
                boxWidth,

              height:
                boxHeight

            };

          },


          videoConstraints: {

            facingMode:
              "environment",

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }

          }

        };


        await scanner.start(

          cameraConfig,

          scanConfig,

          barcodeDetected,

          function() {

            /*
             * Failed frames are normal.
             * Scanner keeps trying.
             */

          }

        );


        scannerRunning =
          true;


        document
          .getElementById("status")
          .textContent =
            "Point the camera at the EAN barcode";


        await configureCamera();


      } catch (error) {

        console.error(error);


        scannerRunning =
          false;


        document
          .getElementById("startButton")
          .style.display =
            "block";


        document
          .getElementById("status")
          .textContent =
            "Camera unavailable";


        showError(
          "Unable to open camera: " +
          String(error)
        );

      }

    }


    async function configureCamera() {

      try {

        const video =
          document.querySelector(
            "#reader video"
          );


        if (
          !video ||
          !video.srcObject
        ) {

          return;

        }


        const tracks =
          video
            .srcObject
            .getVideoTracks();


        if (
          !tracks ||
          tracks.length === 0
        ) {

          return;

        }


        activeTrack =
          tracks[0];


        const settings =
          activeTrack
            .getSettings();


        let capabilities =
          {};


        if (
          typeof activeTrack
            .getCapabilities ===
          "function"
        ) {

          capabilities =
            activeTrack
              .getCapabilities();

        }


        /*
         * Show actual camera resolution.
         */

        if (
          settings.width &&
          settings.height
        ) {

          document
            .getElementById(
              "cameraInfo"
            )
            .textContent =
              settings.width +
              " × " +
              settings.height;

        }


        /*
         * Try continuous autofocus.
         */

        if (
          capabilities.focusMode &&
          capabilities.focusMode.includes(
            "continuous"
          )
        ) {

          try {

            await activeTrack
              .applyConstraints({

                advanced: [

                  {
                    focusMode:
                      "continuous"
                  }

                ]

              });


            console.log(
              "Continuous autofocus enabled."
            );


          } catch (error) {

            console.log(
              "Unable to enable continuous autofocus:",
              error
            );

          }

        }


        /*
         * Check whether browser exposes zoom.
         */

        if (
          capabilities.zoom &&
          typeof capabilities.zoom.min ===
            "number" &&
          typeof capabilities.zoom.max ===
            "number"
        ) {

          zoomSupported =
            true;


          zoomMin =
            capabilities.zoom.min;


          zoomMax =
            capabilities.zoom.max;


          zoomCurrent =
            zoomMin;


          const zoomButton =
            document.getElementById(
              "zoomButton"
            );


          zoomButton.style.display =
            "block";


          zoomButton.textContent =
            "Zoom: Off";

        } else {

          zoomSupported =
            false;

        }


      } catch (error) {

        console.log(
          "Camera configuration error:",
          error
        );

      }

    }


    async function toggleZoom() {

      if (
        !zoomSupported ||
        !activeTrack
      ) {

        return;

      }


      /*
       * Toggle between minimum zoom
       * and approximately 2x.
       */

      if (
        zoomCurrent >
        zoomMin
      ) {

        zoomCurrent =
          zoomMin;

      } else {

        zoomCurrent =
          Math.max(
            zoomMin,
            Math.min(
              2,
              zoomMax
            )
          );

      }


      try {

        await activeTrack
          .applyConstraints({

            advanced: [

              {
                zoom:
                  zoomCurrent
              }

            ]

          });


        document
          .getElementById(
            "zoomButton"
          )
          .textContent =
            zoomCurrent > zoomMin
              ? (
                  "Zoom: " +
                  zoomCurrent.toFixed(1) +
                  "×"
                )
              : "Zoom: Off";


      } catch (error) {

        console.log(
          "Zoom unavailable:",
          error
        );

      }

    }


    async function barcodeDetected(
      decodedText
    ) {

      if (
        !scannerRunning
      ) {

        return;

      }


      const barcode =
        String(
          decodedText || ""
        )
          .trim();


      /*
       * Only accept 13 digit EAN values.
       */

      if (
        !/^\d{13}$/.test(
          barcode
        )
      ) {

        return;

      }


      scannerRunning =
        false;


      try {

        await scanner.stop();

      } catch (error) {

        console.log(error);

      }


      activeTrack =
        null;


      document
        .getElementById("reader")
        .innerHTML =
          "";


      document
        .getElementById(
          "zoomButton"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "status"
        )
        .textContent =
          "Scan complete";


      document
        .getElementById(
          "cameraInfo"
        )
        .textContent =
          "";


      showBarcode(
        barcode,
        "EAN-13"
      );

    }


    function showBarcode(
      barcode,
      format
    ) {

      document
        .getElementById(
          "barcode"
        )
        .textContent =
          barcode;


      document
        .getElementById(
          "format"
        )
        .textContent =
          format;


      document
        .getElementById(
          "result"
        )
        .classList.add(
          "show"
        );

    }


    async function scanAgain() {

      hideResult();


      document
        .getElementById(
          "reader"
        )
        .innerHTML =
          "";


      document
        .getElementById(
          "status"
        )
        .textContent =
          "Ready to scan";


      await startScanner();

    }


    function manualEntry() {

      hideError();


      const barcode =
        document
          .getElementById(
            "manualBarcode"
          )
          .value
          .trim();


      if (
        !/^\d{13}$/.test(
          barcode
        )
      ) {

        showError(
          "Enter a valid 13-digit EAN barcode."
        );

        return;

      }


      showBarcode(
        barcode,
        "EAN-13 (Manual)"
      );

    }


    function hideResult() {

      document
        .getElementById(
          "result"
        )
        .classList.remove(
          "show"
        );

    }


    function showError(
      message
    ) {

      const error =
        document
          .getElementById(
            "error"
          );


      error.textContent =
        message;


      error
        .classList.add(
          "show"
        );

    }


    function hideError() {

      document
        .getElementById(
          "error"
        )
        .classList.remove(
          "show"
        );

    }

  </script>

</body>

</html>
