<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>S124 Filament Scanner</title>

  <!-- ZXing Browser -->
  <script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;

      font-family: Arial, Helvetica, sans-serif;

      background: #f4f7fb;
      color: #1f2937;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      color: #004681;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      color: #667085;
      font-size: 15px;
    }

    .card {
      padding: 18px;

      border: 1px solid #dbe3ec;
      border-radius: 20px;

      background: white;

      box-shadow:
        0 10px 28px
        rgba(31, 41, 55, 0.08);
    }

    .camera-wrap {
      position: relative;

      display: none;

      width: 100%;
      overflow: hidden;

      border-radius: 16px;

      background: #111827;
    }

    .camera-wrap.show {
      display: block;
    }

    video {
      display: block;

      width: 100%;
      min-height: 260px;
      max-height: 420px;

      object-fit: cover;

      background: #111827;
    }

    .scan-guide {
      position: absolute;

      top: 50%;
      left: 50%;

      width: 88%;
      height: 105px;

      transform:
        translate(-50%, -50%);

      border:
        3px solid
        rgba(255, 255, 255, 0.95);

      border-radius: 12px;

      pointer-events: none;

      box-shadow:
        0 0 0 9999px
        rgba(0, 0, 0, 0.15);
    }

    .scan-line {
      position: absolute;

      top: 50%;
      left: 8%;

      width: 84%;
      height: 2px;

      background: #ef4444;

      transform:
        translateY(-50%);

      pointer-events: none;
    }

    button {
      width: 100%;

      margin-top: 14px;
      padding: 15px;

      border: 0;
      border-radius: 12px;

      background: #005bac;
      color: white;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
    }

    button:active {
      background: #004681;
    }

    .secondary {
      background: #475467;
    }

    .status {
      margin-top: 14px;

      color: #667085;
      font-size: 13px;

      text-align: center;
    }

    .camera-info {
      margin-top: 7px;

      color: #98a2b3;
      font-size: 12px;

      text-align: center;
    }

    .result {
      display: none;

      margin-top: 18px;
      padding: 20px;

      border: 2px solid #16a34a;
      border-radius: 16px;

      background: #ecfdf3;

      text-align: center;
    }

    .result.show {
      display: block;
    }

    .result-label {
      color: #667085;

      font-size: 12px;
      font-weight: 700;

      text-transform: uppercase;
    }

    .barcode {
      margin-top: 8px;

      color: #12314d;

      font-size: 27px;
      font-weight: 800;

      word-break: break-all;
    }

    .format {
      margin-top: 6px;

      color: #667085;
      font-size: 13px;
    }

    .error {
      display: none;

      margin-top: 14px;
      padding: 12px;

      border: 1px solid #efb4b4;
      border-radius: 12px;

      background: #fff1f1;
      color: #9b1c1c;

      font-size: 14px;
    }

    .error.show {
      display: block;
    }

    .manual {
      margin-top: 22px;
      padding-top: 20px;

      border-top: 1px solid #dbe3ec;
    }

    .manual label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 700;
    }

    .manual-row {
      display: flex;
      gap: 8px;
    }

    .manual input {
      flex: 1;
      min-width: 0;

      padding: 12px;

      border: 1px solid #dbe3ec;
      border-radius: 10px;

      font-size: 17px;
    }

    .manual button {
      width: auto;

      margin: 0;

      padding-left: 18px;
      padding-right: 18px;
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">

      <h1>S124 Filament Scanner</h1>

      <p>
        Scan the EAN barcode on a filament box
      </p>

    </header>


    <section class="card">

      <button
        id="startButton"
        type="button"
        onclick="startScanner()"
      >
        📷 Scan Barcode
      </button>


      <div
        id="cameraWrap"
        class="camera-wrap"
      >

        <video
          id="video"
          playsinline
          muted
        ></video>

        <div class="scan-guide"></div>

        <div class="scan-line"></div>

      </div>


      <button
        id="stopButton"
        class="secondary"
        type="button"
        onclick="stopScanner()"
        style="display:none;"
      >
        Stop Camera
      </button>


      <div
        id="status"
        class="status"
      >
        Camera not started
      </div>


      <div
        id="cameraInfo"
        class="camera-info"
      ></div>


      <div
        id="error"
        class="error"
      ></div>


      <div
        id="result"
        class="result"
      >

        <div class="result-label">
          Barcode Detected
        </div>

        <div
          id="barcode"
          class="barcode"
        ></div>

        <div
          id="format"
          class="format"
        ></div>

        <button
          type="button"
          onclick="scanAgain()"
        >
          Scan Another
        </button>

      </div>


      <div class="manual">

        <label for="manualBarcode">
          Manual barcode
        </label>

        <div class="manual-row">

          <input
            id="manualBarcode"
            type="text"
            inputmode="numeric"
            maxlength="13"
            placeholder="6975337031345"
          >

          <button
            type="button"
            onclick="manualEntry()"
          >
            Enter
          </button>

        </div>

      </div>

    </section>

  </main>


  <script>

    let codeReader = null;
    let controls = null;
    let scanning = false;
    let detected = false;


    async function startScanner() {

      hideError();
      hideResult();

      detected = false;


      document
        .getElementById("startButton")
        .style.display =
          "none";


      document
        .getElementById("stopButton")
        .style.display =
          "block";


      document
        .getElementById("cameraWrap")
        .classList.add(
          "show"
        );


      document
        .getElementById("status")
        .textContent =
          "Starting rear camera...";


      try {

        codeReader =
          new ZXingBrowser.BrowserMultiFormatReader();


        scanning = true;


        controls =
          await codeReader.decodeFromConstraints(

            {
              audio: false,

              video: {

                facingMode: {
                  ideal: "environment"
                },

                width: {
                  ideal: 1920
                },

                height: {
                  ideal: 1080
                }

              }
            },

            document.getElementById(
              "video"
            ),

            function(
              result,
              error,
              controls
            ) {

              if (
                result &&
                scanning &&
                !detected
              ) {

                const text =
                  String(
                    result.getText()
                  ).trim();


                /*
                 * For now we only accept
                 * 13 digit EAN values.
                 */

                if (
                  /^\d{13}$/.test(
                    text
                  )
                ) {

                  barcodeDetected(
                    text,
                    result
                  );

                }

              }

            }

          );


        document
          .getElementById("status")
          .textContent =
            "Point the barcode inside the box";


        setTimeout(
          configureCamera,
          600
        );


      } catch (error) {

        console.error(error);


        scanning = false;


        document
          .getElementById("startButton")
          .style.display =
            "block";


        document
          .getElementById("stopButton")
          .style.display =
            "none";


        document
          .getElementById("cameraWrap")
          .classList.remove(
            "show"
          );


        document
          .getElementById("status")
          .textContent =
            "Camera unavailable";


        showError(
          "Unable to open camera: " +
          String(error)
        );

      }

    }


    async function configureCamera() {

      try {

        const video =
          document.getElementById(
            "video"
          );


        if (
          !video.srcObject
        ) {

          return;

        }


        const tracks =
          video
            .srcObject
            .getVideoTracks();


        if (
          !tracks.length
        ) {

          return;

        }


        const track =
          tracks[0];


        const settings =
          track.getSettings();


        document
          .getElementById(
            "cameraInfo"
          )
          .textContent =
            settings.width &&
            settings.height
              ? (
                  settings.width +
                  " × " +
                  settings.height
                )
              : "";


        /*
         * Ask the phone for continuous
         * autofocus if supported.
         */

        if (
          typeof track.getCapabilities ===
          "function"
        ) {

          const capabilities =
            track.getCapabilities();


          if (
            capabilities.focusMode &&
            capabilities.focusMode.includes(
              "continuous"
            )
          ) {

            try {

              await track
                .applyConstraints({

                  advanced: [
                    {
                      focusMode:
                        "continuous"
                    }
                  ]

                });

            } catch (error) {

              console.log(
                "Autofocus not available",
                error
              );

            }

          }

        }


      } catch (error) {

        console.log(
          "Camera configuration:",
          error
        );

      }

    }


    async function barcodeDetected(
      barcode,
      result
    ) {

      if (detected) {
        return;
      }


      detected = true;
      scanning = false;


      let format =
        "EAN-13";


      try {

        if (
          result &&
          result.getBarcodeFormat
        ) {

          format =
            String(
              result.getBarcodeFormat()
            );

        }

      } catch (error) {

        format =
          "EAN-13";

      }


      stopScanner();


      showBarcode(
        barcode,
        format
      );

    }


    function stopScanner() {

      scanning = false;


      if (controls) {

        try {

          controls.stop();

        } catch (error) {

          console.log(error);

        }

      }


      controls = null;


      const video =
        document.getElementById(
          "video"
        );


      if (
        video.srcObject
      ) {

        video
          .srcObject
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        video.srcObject =
          null;

      }


      document
        .getElementById("cameraWrap")
        .classList.remove(
          "show"
        );


      document
        .getElementById("stopButton")
        .style.display =
          "none";


      document
        .getElementById("startButton")
        .style.display =
          "block";


      document
        .getElementById("cameraInfo")
        .textContent =
          "";


      if (!detected) {

        document
          .getElementById("status")
          .textContent =
            "Camera stopped";

      }

    }


    function showBarcode(
      barcode,
      format
    ) {

      document
        .getElementById("barcode")
        .textContent =
          barcode;


      document
        .getElementById("format")
        .textContent =
          format;


      document
        .getElementById("result")
        .classList.add(
          "show"
        );


      document
        .getElementById("status")
        .textContent =
          "Scan complete";

    }


    function scanAgain() {

      hideResult();

      startScanner();

    }


    function manualEntry() {

      hideError();


      const barcode =
        document
          .getElementById(
            "manualBarcode"
          )
          .value
          .trim();


      if (
        !/^\d{13}$/.test(
          barcode
        )
      ) {

        showError(
          "Enter a valid 13-digit EAN barcode."
        );

        return;

      }


      detected = true;


      stopScanner();


      showBarcode(
        barcode,
        "EAN-13 (Manual)"
      );

    }


    function hideResult() {

      document
        .getElementById("result")
        .classList.remove(
          "show"
        );

    }


    function showError(
      message
    ) {

      const element =
        document.getElementById(
          "error"
        );


      element.textContent =
        message;


      element.classList.add(
        "show"
      );

    }


    function hideError() {

      document
        .getElementById("error")
        .classList.remove(
          "show"
        );

    }

  </script>

</body>
</html>
